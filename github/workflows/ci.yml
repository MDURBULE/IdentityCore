name: Java CI

on:
  push:
    branches:
      -main
      -develop
  pull_reqeust:
    branches:
      -main
      -develop

jobs:
  build:
    runs-on: ubantu-latest
    steps:
      -name: Checkout source code 
      uses: action/Checkout@v4

      -name: Setup java 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"
        cache: "maven"

      -name: run test
      run: ./mvnw clean test

      -name: build application 
      run: ./mvnw clean package -DskipTests

      -name: build docker image
      run: docker build -t identity-core:latest



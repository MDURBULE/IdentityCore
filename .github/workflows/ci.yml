name: Java CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout IdentityCore
        uses: actions/checkout@v4

      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          repository: MDURBULE/Master
          path: Master

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Make Maven wrappers executable
        run: |
          chmod +x ./mvnw
          chmod +x ./Master/mvnw

      - name: Build and install Master
        working-directory: ./Master
        run: ./mvnw clean install -DskipTests -Dspring-boot.repackage.skip=true

      - name: Build IdentityCore
        run: ./mvnw clean package -DskipTests

      - name: Build Docker image
        run: docker build -t identity-core:latest .